name: Submission check

# Checks pull requests that touch the gallery, Malfoid Index, guest entries or the site build, so broken data
# (a bad YAML file, missing credit, or a missing image) is caught before merge rather than on the next push to main.

on:
  pull_request:
    paths:
      - "gallery.yaml"
      - "input/**"
      - "plan/**"
      - "images/**"
      - "videos/**"
      - "references/**"
      - "ideas/**"
      - "malfoid-index/**"
      - "guest/**"
      - "scripts/**"
      - "site/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install pillow pyyaml

      - name: Build the site
        run: python scripts/build_site.py --out "$RUNNER_TEMP/site" --no-thumbs

      - name: Run build guardrail tests
        run: python -m unittest discover -s tests

      - name: Check external guest image links
        run: python scripts/check_guest_images.py
